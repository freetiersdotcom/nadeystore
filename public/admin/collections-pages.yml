                required: true
                hint: "Mots entre accolades remplacés automatiquement : {brand} {city} {country} {address} {whatsapp} {phone} {email}."
              - name: description
                label: Description
                widget: text
                required: false
          - name: sections
            label: Sections de la page
            label_singular: section
