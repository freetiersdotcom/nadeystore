                    hint: Change seulement la mise en forme de cette section.
                    required: false
                    default: split
                    options:
                      - label: Image à côté du texte
                        value: split
                      - label: Texte centré, image dessous
                        value: centered
                  - name: tagline
                    label: Sur-titre
                    widget: string
                    required: false
                  - name: title
                    label: Titre
                    widget: string
                    required: false
                    hint: "Mots entre accolades remplacés automatiquement : {brand} {city} {country} {address} {whatsapp} {phone} {email}."
                  - name: subtitle
                    label: Sous-titre
                    widget: text
                    required: false
                  - name: actions
                    label: Boutons
                    label_singular: bouton
                    widget: list
                    summary: "{{fields.text}}"
                    required: false
                    fields:
                      - name: variant
                        label: Style
                        widget: select
                        required: false
                        options:
                          - label: Principal
                            value: primary
                          - label: Secondaire
                            value: secondary
                          - label: Discret
                            value: tertiary
                          - label: Lien
                            value: link
                      - name: text
                        label: Texte du bouton
                        widget: string
                        required: true
                      - name: href
                        label: Lien
                        widget: string
                        required: true
                        hint: Une adresse (https://…), un chemin (/fr/boutique) ou un lien WhatsApp.
                      - name: icon
                        label: Icône
                        widget: string
                        required: false
                        hint: "Nom d’icône, par exemple tabler:truck-delivery ou tabler:brand-whatsapp (liste : tabler.io/icons)."
                  - name: image
                    label: Image
                    widget: object
                    required: false
                    fields:
                      - name: src
                        label: Image (fichier ou adresse)
                        widget: image
                        choose_url: true
                      - name: alt
                        label: Description de l’image (accessibilité)
                        widget: string
                        required: false
