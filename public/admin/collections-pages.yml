# Content pages (generated by scripts/gen-cms-pages.mjs, do not edit by hand: change the generator and run it again).
# Appended to the "collections:" list of public/admin/config.yml by kit 58 (apply-cms.mjs).
  - name: pages_fr
    label: Pages du site (français)
    files:
      - name: home
        label: Accueil
        file: src/content/pages/fr/home.yaml
