# DRAFT — untested. Check field names against the current Sveltia CMS docs.
backend:
  name: github
  repo: freetiersdotcom/nadeystore
  branch: main
  # base_url: https://YOUR-OAUTH-WORKER   # needed for GitHub login (Sveltia's auth worker)
  # Safer for a non-technical editor: enable editorial workflow so edits become
  # a branch/PR you approve instead of going live directly.
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads
locale: fr

collections:
  - name: landing
    label: Pages d'annonce
    folder: src/content/landing
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    fields:
      - name: fr
        label: Français
        widget: object
        fields: &page_fields
          - { name: meta, label: Référencement, widget: object, fields: [ { name: title, label: Titre }, { name: description, label: Description, widget: text } ] }
          - { name: whatsapp_message, label: Message WhatsApp pré-rempli, widget: string }
          - name: hero
            label: En-tête
            widget: object
            fields:
              - { name: eyebrow, label: Sur-titre, widget: string, required: false }
              - { name: title, label: Titre }
              - { name: subtitle, label: Sous-titre, widget: text, required: false }
              - { name: image, label: Image, widget: image, required: false }
              - { name: image_alt, label: Texte alternatif, required: false }
              - { name: cta_label, label: Texte du bouton, required: false }
          - name: benefits
            label: Avantages
            widget: object
            required: false
            fields:
              - { name: title, label: Titre, required: false }
              - name: items
                label: Éléments
                widget: list
                fields: [ { name: title, label: Titre }, { name: text, label: Texte, widget: text } ]
          - name: products
            label: Produits (slugs)
            widget: object
            required: false
            fields:
              - { name: title, label: Titre, required: false }
              - { name: slugs, label: Slugs des produits, widget: list, field: { name: slug, label: Slug } }
          - name: steps
            label: Étapes
            widget: object
            required: false
            fields:
              - { name: title, label: Titre, required: false }
              - name: items
                label: Étapes
                widget: list
                fields: [ { name: title, label: Titre }, { name: text, label: Texte, widget: text } ]
          - name: faq
            label: Questions fréquentes
            widget: object
            required: false
            fields:
              - { name: title, label: Titre, required: false }
              - name: items
                label: Questions
                widget: list
                fields: [ { name: q, label: Question }, { name: a, label: Réponse, widget: text } ]
          - name: final
            label: Appel final
            widget: object
            required: false
            fields:
              - { name: title, label: Titre }
              - { name: text, label: Texte, widget: text, required: false }
              - { name: cta_label, label: Texte du bouton, required: false }
      - name: en
        label: English
        widget: object
        required: false
        fields: *page_fields

  - name: blog_fr
    label: Blog (français)
    label_singular: article
    folder: src/data/post/fr
    extension: md
    format: frontmatter
    create: true
    slug: '{{fields.key}}'
    summary: '{{title}}'
    sortable_fields: [publishDate, title]
    fields:
      - { name: title, label: Titre, widget: string }
      - name: key
        label: Identifiant d'URL (lettres minuscules, chiffres et tirets)
        hint: "Devient l'adresse de l'article : /fr/blog/<identifiant>. Utilisez le MÊME identifiant que la version anglaise pour relier les deux traductions."
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lettres minuscules, chiffres et tirets uniquement"]
      - { name: excerpt, label: Résumé (affiché dans la liste et sur Google), widget: text }
      - { name: image, label: Image principale, widget: image, required: false }
      - { name: category, label: Catégorie, widget: string, required: false }
      - { name: tags, label: Mots-clés, widget: list, required: false }
      - { name: author, label: Auteur, widget: string, required: false }
      - { name: publishDate, label: Date de publication, widget: datetime }
      - { name: draft, label: Brouillon (non publié), widget: boolean, default: true }
      - { name: body, label: Texte, widget: markdown }

  - name: blog_en
    label: Blog (English)
    label_singular: article
    folder: src/data/post/en
    extension: md
    format: frontmatter
    create: true
    slug: '{{fields.key}}'
    summary: '{{title}}'
    sortable_fields: [publishDate, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: key
        label: URL identifier (lowercase letters, digits and hyphens)
        hint: "Becomes the article address: /en/blog/<identifier>. Use the SAME identifier as the French version to link the two translations."
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, digits and hyphens only"]
      - { name: excerpt, label: Summary (shown in the list and on Google), widget: text }
      - { name: image, label: Main image, widget: image, required: false }
      - { name: category, label: Category, widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: author, label: Author, widget: string, required: false }
      - { name: publishDate, label: Publication date, widget: datetime }
      - { name: draft, label: Draft (not published), widget: boolean, default: true }
      - { name: body, label: Text, widget: markdown }
