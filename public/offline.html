<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F6B4B">
<title>Santé Natur’</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F8F6F0;color:#2B2B2B;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;text-align:center}
  main{max-width:420px}
  h1{font-size:22px;margin:0 0 8px;color:#0F6B4B}
  p{margin:0 0 20px;line-height:1.5}
  button{font:inherit;background:#0F6B4B;color:#fff;border:0;border-radius:10px;padding:14px 22px;min-height:48px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1 id="t">Pas de connexion</h1>
  <p id="p">Vérifiez votre connexion internet puis réessayez. Votre panier est conservé sur cet appareil.</p>
  <button id="b" onclick="location.reload()">Réessayer</button>
</main>
<script>
  if ((navigator.language || '').toLowerCase().startsWith('en')) {
    document.documentElement.lang = 'en';
    document.getElementById('t').textContent = 'You are offline';
    document.getElementById('p').textContent = 'Check your internet connection and try again. Your cart is kept on this device.';
    document.getElementById('b').textContent = 'Try again';
  }
</script>
</body>
</html>
